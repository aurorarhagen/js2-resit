<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | LinkUp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&display=swap" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body id="bg-home-page">
<div class="px-4 py-5 bg-light position-absolute top-50 start-50 translate-middle rounded" style="width: 400px;">
  <h1 class="text-center text-primary">LinkUp</h1>
  <form class="container pt-2" action="profile/index.html"  method="GET">
  <div class="mb-3">
    <label for="inputEmail" class="form-label">Email</label>
    <input type="email" class="form-control" id="inputEmail" aria-describedby="emailHelp" required>
  </div>
  <div class="mb-3">
    <label for="inputPassword" class="form-label">Password</label>
    <input type="password" class="form-control" id="inputPassword" required minlength="8">
    <div class="form-text">Password must be at least 8 characters long.</div>
  </div>
  <div>
    <button type="submit" class="btn btn-primary d-grid gap-2 mx-auto">Log In</button>
  </div>
</form>
  <div class="text-center pt-4">
    <p>Don't have an account?</p>
    <h3>Sign up now</h3>
  </div>
</div>
</body>
</html>
